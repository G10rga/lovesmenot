<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<meta name="theme-color" content="#0f1026"/>
<title>Loves Me, Loves Me Not 🌸 Whimsical Enchanted Garden</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&amp;family=Nunito:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      overscroll-behavior: none;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100vw;
      height: 100vh;
      height: 100dvh;
      font-family: 'Fredoka', 'Nunito', sans-serif;
      user-select: none;
      overflow: hidden;
      background: #0f1026;
      touch-action: manipulation;
    }

    button, [role="button"], #flower-center-kawaii, #petals-group g {
      touch-action: manipulation;
    }

    /* Soft press feedback without sticky hover on touch */
    @media (hover: hover) and (pointer: fine) {
      .hover-lift:hover {
        transform: translateY(-2px);
      }
      .leaf-hover:hover path:first-child {
        filter: brightness(1.12);
      }
    }

    button:active {
      transform: scale(0.96);
    }

    .app-header {
      padding-top: max(0.75rem, env(safe-area-inset-top));
    }

    .app-footer {
      padding-bottom: max(0.85rem, env(safe-area-inset-bottom));
      padding-left: max(0.75rem, env(safe-area-inset-left));
      padding-right: max(0.75rem, env(safe-area-inset-right));
    }

    /* Mobile stage: keep daisy + stem inside the usable viewport */
    @media (max-width: 640px) {
      #status-title {
        font-size: clamp(1.35rem, 7vw, 1.85rem) !important;
        line-height: 1.15;
        padding: 0 0.5rem;
      }
      #sub-status {
        font-size: 0.7rem !important;
        line-height: 1.35;
        max-width: 18rem;
      }
      #stem-svg {
        width: min(42vw, 11.5rem) !important;
        height: min(42vh, 16.5rem) !important;
      }
      #flower-head {
        top: -5.25rem !important;
        margin-left: 0.35rem !important;
      }
      #flower-svg {
        width: min(58vw, 13.5rem) !important;
        height: min(58vw, 13.5rem) !important;
      }
      .meadow-side {
        transform: scale(0.72);
        transform-origin: bottom center;
        opacity: 0.85;
      }
      .meadow-mid-blooms {
        display: none !important;
      }
      .moon-floating {
        width: 3.75rem !important;
        height: 3.75rem !important;
        top: max(0.75rem, env(safe-area-inset-top)) !important;
        right: 0.75rem !important;
      }
    }

    @media (max-width: 640px) and (max-height: 720px) {
      #stem-svg {
        height: min(36vh, 14rem) !important;
      }
      #flower-head {
        top: -4.4rem !important;
      }
      #flower-svg {
        width: min(52vw, 11.75rem) !important;
        height: min(52vw, 11.75rem) !important;
      }
      .meadow-panel {
        height: 9.5rem !important;
      }
    }

    @media (max-height: 620px) {
      .hud-badges {
        display: none !important;
      }
      #sub-status {
        display: none !important;
      }
      .meadow-side {
        display: none !important;
      }
    }

    @keyframes skyCycle {
      0%, 100% {
        background: radial-gradient(circle at 50% 18%, #281d59 0%, #1b1642 38%, #11142e 72%, #0a0b1c 100%);
      }
      50% {
        background: radial-gradient(circle at 50% 25%, #342168 0%, #221a4f 40%, #131735 75%, #0a0b1c 100%);
      }
    }
    .enchanted-sky {
      animation: skyCycle 20s ease-in-out infinite;
    }

    @keyframes cloudFloat1 {
      0% { transform: translateX(-140%); }
      100% { transform: translateX(260vw); }
    }
    @keyframes cloudFloat2 {
      0% { transform: translateX(-160%); }
      100% { transform: translateX(240vw); }
    }
    @keyframes cloudFloat3 {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(270vw); }
    }
    .cloud-layer-1 { animation: cloudFloat1 64s linear infinite; }
    .cloud-layer-2 { animation: cloudFloat2 48s linear infinite; }
    .cloud-layer-3 { animation: cloudFloat3 78s linear infinite; }

    @keyframes moonFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-9px) rotate(2deg); }
    }
    .moon-floating {
      animation: moonFloat 7s ease-in-out infinite;
    }

    @keyframes sparkleGlow {
      0%, 100% { opacity: 0.25; transform: scale(0.65) rotate(0deg); }
      50% { opacity: 0.95; transform: scale(1.22) rotate(45deg); filter: drop-shadow(0 0 8px rgba(254, 240, 138, 0.95)); }
    }
    .twinkle-star {
      animation: sparkleGlow var(--speed, 3.2s) infinite ease-in-out;
    }

    @keyframes fireflyDrift {
      0% {
        opacity: 0;
        transform: translate(0, 0) scale(0.6);
      }
      20% {
        opacity: 0.9;
        transform: translate(calc(var(--fx) * 0.3), -35px) scale(1.1);
      }
      60% {
        opacity: 0.8;
        transform: translate(var(--fx), -85px) scale(0.9);
      }
      100% {
        opacity: 0;
        transform: translate(calc(var(--fx) * 1.4), -140px) scale(0.4);
      }
    }
    .firefly-spark {
      animation: fireflyDrift var(--dur, 6s) ease-in-out infinite;
    }

    @keyframes swaySoft {
      0%, 100% { transform: rotate(-2.5deg); }
      50% { transform: rotate(3deg); }
    }
    .sway-grass {
      transform-origin: bottom center;
      animation: swaySoft 4.5s ease-in-out infinite;
    }
    .sway-flower-left {
      transform-origin: bottom center;
      animation: swaySoft 3.8s ease-in-out infinite;
    }
    .sway-flower-right {
      transform-origin: bottom center;
      animation: swaySoft 4.8s ease-in-out infinite 0.9s;
    }

    @keyframes flowerPluckRecoil {
      0% {
        transform: translate(-50%, 0) rotate(0deg);
      }
      20% {
        transform: translate(calc(-50% + 18px), 8px) rotate(9.5deg);
      }
      45% {
        transform: translate(calc(-50% - 13px), -6px) rotate(-6.5deg);
      }
      70% {
        transform: translate(calc(-50% + 7px), 3px) rotate(3deg);
      }
      85% {
        transform: translate(calc(-50% - 3px), -1px) rotate(-1.5deg);
      }
      100% {
        transform: translate(-50%, 0) rotate(0deg);
      }
    }
    .spring-recoil {
      animation: flowerPluckRecoil 0.75s cubic-bezier(0.28, 1.45, 0.58, 1) !important;
      transform-origin: center 80px;
    }

    @keyframes neckSpring {
      0% { transform: rotate(0deg); }
      22% { transform: rotate(6.5deg) translateX(5px); }
      52% { transform: rotate(-4deg) translateX(-3px); }
      78% { transform: rotate(1.6deg); }
      100% { transform: rotate(0deg); }
    }
    .neck-recoil {
      animation: neckSpring 0.75s cubic-bezier(0.28, 1.45, 0.58, 1);
      transform-origin: 104px 280px;
    }

    @keyframes stemSwayTilted {
      0%, 100% { transform: rotate(-2.4deg); }
      50% { transform: rotate(1.8deg); }
    }
    .stem-gentle-sway {
      transform-origin: bottom center;
      animation: stemSwayTilted 6.5s ease-in-out infinite;
    }

    @keyframes floatParticle {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.3) rotate(0deg);
      }
      18% {
        opacity: 1;
        transform: translate(calc(-50% + var(--dx, 0px) * 0.35), calc(-50% - 30px)) scale(1.2) rotate(15deg);
      }
      75% {
        opacity: 0.95;
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% - 170px)) scale(0.7) rotate(var(--rot, 50deg));
      }
    }
    .particle-float {
      animation: floatParticle 2.5s cubic-bezier(0.2, 0.8, 0.25, 1) forwards;
    }

    @keyframes petalFallFlutter {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1) rotate(var(--base-rot, 0deg));
      }
      22% {
        opacity: 0.96;
        transform: translate(calc(var(--dir, 1) * 45px), 48px) scale(0.96) rotate(calc(var(--base-rot, 0deg) + var(--dir, 1) * 35deg));
      }
      52% {
        opacity: 0.85;
        transform: translate(calc(var(--dir, 1) * 20px), 135px) scale(0.9) rotate(calc(var(--base-rot, 0deg) + var(--dir, 1) * -30deg));
      }
      100% {
        opacity: 0;
        transform: translate(calc(var(--dir, 1) * 80px), 280px) scale(0.68) rotate(calc(var(--base-rot, 0deg) + var(--dir, 1) * 110deg));
      }
    }
    .plucked-falling {
      animation: petalFallFlutter 1.05s cubic-bezier(0.35, 0.1, 0.25, 1) forwards !important;
      pointer-events: none;
    }

    @keyframes sproutBloom {
      0% {
        transform: scale(0) translateY(180px) rotate(-18deg);
        opacity: 0;
      }
      65% {
        transform: scale(1.1) translateY(-10px) rotate(4deg);
        opacity: 1;
      }
      85% {
        transform: scale(0.97) translateY(2px) rotate(-2deg);
      }
      100% {
        transform: scale(1) translateY(0) rotate(0deg);
        opacity: 1;
      }
    }
    .blooming-sprout {
      animation: sproutBloom 1.05s cubic-bezier(0.34, 1.45, 0.64, 1) forwards;
    }

    @keyframes blink {
      0%, 91%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.08); }
    }
    .eye-blink {
      transform-origin: center;
      animation: blink 4.2s infinite;
    }

    @keyframes popHaptic {
      0% { transform: scale(1); }
      50% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }
    .haptic-pop {
      animation: popHaptic 0.25s ease-out;
    }

    @keyframes popBanner {
      0% { transform: scale(0.7); opacity: 0; }
      60% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .banner-pop {
      animation: popBanner 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
  </style>
</head>

<script>
    let currentTotalPetals = 8;

    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    const statusTitle = document.getElementById('status-title');
    const subStatus = document.getElementById('sub-status');

    const pluckBtn = document.getElementById('pluck-btn');

    const stemSvg = document.getElementById('stem-svg');

    const flowerCenterKawaii = document.getElementById('flower-center-kawaii');
    const particlesContainer = document.getElementById('particles-container');
    const starsLayer = document.getElementById('stars-layer');
    const firefliesLayer = document.getElementById('fireflies-layer');
    const mouth = document.getElementById('mouth');
    const tongue = document.getElementById('tongue');
    const blushLeft = document.getElementById('blush-left');
    const blushRight = document.getElementById('blush-right');
    const sweatDrop = document.getElementById('sweat-drop');
    const soundBtn = document.getElementById('sound-btn');
    const soundIcon = document.getElementById('sound-icon');
    const soundLabel = document.getElementById('sound-label');

    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playMusicBoxNote(freq, startTime, duration = 0.5, peakGain = 0.065) {
      const ctx = getAudioContext();
      if (!ctx) return;

      const osc = ctx.createOscillator();
      const gainNode = ctx.createGain();
      const filter = ctx.createBiquadFilter();

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1400, startTime);
      filter.Q.setValueAtTime(1.2, startTime);

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, startTime);

      gainNode.gain.setValueAtTime(0.0001, startTime);
      gainNode.gain.exponentialRampToValueAtTime(peakGain, startTime + 0.035);
      gainNode.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

      osc.connect(filter);
      filter.connect(gainNode);
      gainNode.connect(ctx.destination);

      osc.start(startTime);
      osc.stop(startTime + duration + 0.05);
    }

    function playCuteChime(type = 'pluck') {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;

        if (type === 'love') {
          playMusicBoxNote(523.25, now, 0.42, 0.055);
          playMusicBoxNote(659.25, now + 0.09, 0.45, 0.060);
          playMusicBoxNote(783.99, now + 0.18, 0.55, 0.050);
        } else if (type === 'fanfare') {
          const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
          notes.forEach((freq, idx) => {
            playMusicBoxNote(freq, now + idx * 0.075, 0.65, 0.05);
          });
        } else if (type === 'not') {
          playMusicBoxNote(440.00, now, 0.42, 0.045);
          playMusicBoxNote(329.63, now + 0.12, 0.52, 0.040);
        } else if (type === 'consoling') {
          const notes = [392.00, 349.23, 293.66, 261.63];
          notes.forEach((freq, idx) => {
            playMusicBoxNote(freq, now + idx * 0.12, 0.55, 0.045);
          });
        } else if (type === 'grow') {
          playMusicBoxNote(261.63, now, 0.45, 0.05);
          playMusicBoxNote(392.00, now + 0.1, 0.50, 0.055);
          playMusicBoxNote(523.25, now + 0.22, 0.60, 0.05);
        }
      } catch (e) {
        // ignore audio failures
      }
    }

    soundBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      if (soundEnabled) {
        soundIcon.textContent = '🔔';
        soundLabel.textContent = 'Chimes On';
        soundLabel.className = 'text-[10px] sm:text-xs font-bold uppercase tracking-wider text-amber-200';
        playCuteChime('love');
      } else {
        soundIcon.textContent = '🔕';
        soundLabel.textContent = 'Muted';
        soundLabel.className = 'text-[10px] sm:text-xs font-bold uppercase tracking-wider text-slate-400';

    const PETAL_PROFILES = [

        vein: 'M -1 -24 Q -8 -63 -4 -97',

    function createStars() {
      starsLayer.innerHTML = '';
      const starCount = window.innerWidth > 768 ? 36 : 22;
      for (let i = 0; i < starCount; i++) {
        const star = document.createElement('div');

        const size = Math.floor(Math.random() * 14) + 7;

        `;

    }

    function createFireflies() {
      firefliesLayer.innerHTML = '';
      const fireflyCount = 14;
      for (let i = 0; i < fireflyCount; i++) {
        const ff = document.createElement('div');
        ff.className = 'firefly-spark absolute pointer-events-none rounded-full bg-amber-300 blur-[0.6px]';
        const size = Math.random() * 4 + 3;
        ff.style.width = size + 'px';
        ff.style.height = size + 'px';
        ff.style.left = (Math.random() * 92 + 4) + '%';
        ff.style.bottom = (Math.random() * 25 + 2) + '%';
        ff.style.boxShadow = '0 0 8px 2px rgba(253, 224, 71, 0.7)';
        ff.style.setProperty('--fx', (Math.random() * 60 - 30) + 'px');
        ff.style.setProperty('--dur', (5 + Math.random() * 5) + 's');
        ff.style.animationDelay = (Math.random() * 5) + 's';
        firefliesLayer.appendChild(ff);
      }
    }

    function createPetalElement(index, total) {
      const baseAngle = (360 / total) * index;
      const profile = PETAL_PROFILES[index % PETAL_PROFILES.length];
      const finalAngle = baseAngle + profile.extraRot;

      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('transform', `rotate(${finalAngle})`);
      g.setAttribute('filter', 'url(#softPetalShadow)');
      g.dataset.index = index;
      g.dataset.angle = finalAngle;
      g.style.cursor = 'pointer';
      g.style.transformOrigin = '0px 0px';
      g.style.transition = 'transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease';

      const petalPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      petalPath.setAttribute('d', profile.path);
      petalPath.setAttribute('fill', index % 2 === 0 ? 'url(#petalGradient)' : 'url(#petalWarmGrad)');
      petalPath.setAttribute('stroke', '#fdf4ff');
      petalPath.setAttribute('stroke-width', '2.2');
      petalPath.setAttribute('stroke-linejoin', 'round');

      const vein = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      vein.setAttribute('d', profile.vein);
      vein.setAttribute('stroke', '#e9d5ff');
      vein.setAttribute('stroke-width', '1.8');
      vein.setAttribute('stroke-linecap', 'round');
      vein.setAttribute('fill', 'none');

      const gloss = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
      gloss.setAttribute('cx', profile.gloss.cx);
      gloss.setAttribute('cy', profile.gloss.cy);
      gloss.setAttribute('rx', profile.gloss.rx);
      gloss.setAttribute('ry', profile.gloss.ry);
      if (profile.gloss.rot) {
        gloss.setAttribute('transform', `rotate(${profile.gloss.rot} ${profile.gloss.cx} ${profile.gloss.cy})`);
      }
      gloss.setAttribute('fill', '#ffffff');
      gloss.setAttribute('opacity', '0.7');

      const rimSheen = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      rimSheen.setAttribute('d', profile.rim);
      rimSheen.setAttribute('stroke', '#ffffff');
      rimSheen.setAttribute('stroke-width', '2.4');
      rimSheen.setAttribute('stroke-linecap', 'round');
      rimSheen.setAttribute('fill', 'none');
      rimSheen.setAttribute('opacity', '0.85');

      g.appendChild(petalPath);
      g.appendChild(vein);
      g.appendChild(gloss);
      g.appendChild(rimSheen);

      g.addEventListener('mouseenter', () => {
        if (!isAnimating) {
          g.setAttribute('transform', `rotate(${finalAngle}) scale(1.08)`);
        }
      });
      g.addEventListener('mouseleave', () => {
        if (!isAnimating) {
          g.setAttribute('transform', `rotate(${finalAngle}) scale(1)`);
        }
      });

      g.addEventListener('click', (e) => {
        e.stopPropagation();
        pluckSpecificPetal(index);
      });

      return g;
    }

    function setFaceExpression(mood) {
      if (mood === 'happy' || mood === 'celebrate') {
        mouth.setAttribute('d', 'M -8 8 Q 0 21 8 8 Z');
        tongue.style.display = 'block';
        blushLeft.style.opacity = '0.95';
        blushRight.style.opacity = '0.95';
        blushLeft.setAttribute('fill', '#f43f5e');
        blushRight.setAttribute('fill', '#f43f5e');
        sweatDrop.style.opacity = '0';
      } else if (mood === 'shy-sad') {
        mouth.setAttribute('d', 'M -7 13 Q 0 7 7 13');
        tongue.style.display = 'none';
        blushLeft.style.opacity = '0.45';
        blushRight.style.opacity = '0.45';
        blushLeft.setAttribute('fill', '#ec4899');
        blushRight.setAttribute('fill', '#ec4899');
        sweatDrop.style.opacity = '0.9';
      } else if (mood === 'pout') {
        mouth.setAttribute('d', 'M -8 14 Q 0 4 8 14');
        tongue.style.display = 'none';
        blushLeft.style.opacity = '0.7';
        blushRight.style.opacity = '0.7';
        blushLeft.setAttribute('fill', '#f97316');
        blushRight.setAttribute('fill', '#f97316');
        sweatDrop.style.opacity = '1';
      } else {
        mouth.setAttribute('d', 'M -7 9 Q 0 17 7 9');
        tongue.style.display = 'block';
        blushLeft.style.opacity = '0.65';
        blushRight.style.opacity = '0.65';
        sweatDrop.style.opacity = '0';
      }
    }

    function spawnParticles(type = 'hearts') {
      const count = type === 'celebration' ? 36 : (type === 'hearts' ? 20 : 14);
      const headRect = flowerHead.getBoundingClientRect();

      const originX = headRect.left + headRect.width / 2;
      const originY = headRect.top + headRect.height / 2;

      for (let i = 0; i < count; i++) {
        const particle = document.createElement('div');
        particle.className = 'fixed particle-float pointer-events-none select-none z-50';

        const dx = (Math.random() - 0.5) * (type === 'celebration' ? 340 : 220);
        const rot = (Math.random() - 0.5) * 160;
        const delay = Math.random() * 0.4;
        const scale = 0.85 + Math.random() * 0.85;

        particle.style.left = (originX + (Math.random() - 0.5) * 70) + 'px';
        particle.style.top = (originY + (Math.random() - 0.5) * 60) + 'px';
        particle.style.setProperty('--dx', dx + 'px');
        particle.style.setProperty('--rot', rot + 'deg');
        particle.style.animationDelay = delay + 's';
        particle.style.transform = `scale(${scale})`;

        if (type === 'celebration' || type === 'hearts') {
          const heartIcons = ['💖', '💕', '✨', '🌸', '💫', '💗', '❤️', '🌟', '🌷'];
          const icon = heartIcons[Math.floor(Math.random() * heartIcons.length)];
          particle.innerHTML = `<span class="text-2xl filter drop-shadow-[0_4px_12px_rgba(244,63,94,0.85)]">${icon}</span>`;
        } else {
          const sadIcons = ['🌧️', '💧', '🍂', '🍃', '✨', '☁️', '💔'];
          const icon = sadIcons[Math.floor(Math.random() * sadIcons.length)];
          particle.innerHTML = `<span class="text-xl filter drop-shadow-[0_3px_6px_rgba(100,116,139,0.6)]">${icon}</span>`;
        }

        particlesContainer.appendChild(particle);

        setTimeout(() => {
          particle.remove();
        }, 2600);
      }
    }

    function initializeFlower(withBloomAnimation = false) {
      petalsGroup.innerHTML = '';
      remainingPetals = [];
      stateIndex = 0;
      isAnimating = false;

      currentTotalPetals = getRandomInt(7, 13);

      for (let i = 0; i < currentTotalPetals; i++) {
        const petalEl = createPetalElement(i, currentTotalPetals);
        petalsGroup.appendChild(petalEl);
        remainingPetals.push(i);
      }

      setFaceExpression('neutral');
      updateUI('LOVES ME NOT', 'text-white', '✨ Pluck a soft petal to discover their heart ✨', currentTotalPetals);

      if (withBloomAnimation) {
        playCuteChime('grow');
        flowerHead.classList.remove('spring-recoil');
        stemSvg.classList.remove('neck-recoil');
        flowerWrapper.classList.remove('blooming-sprout');
        void flowerWrapper.offsetWidth;
        flowerWrapper.classList.add('blooming-sprout');

        setTimeout(() => {
          spawnParticles('hearts');
        }, 450);
      }
    }

    function pluckSpecificPetal(targetIndex) {
      if (isAnimating) return;
      const pos = remainingPetals.indexOf(targetIndex);
      if (pos === -1) return;
      pluckAtIndex(pos);
    }

    function pluckNextPetal() {
      if (isAnimating || remainingPetals.length === 0) return;
      pluckAtIndex(0);
    }

    function pluckAtIndex(arrayPos) {
      isAnimating = true;
      const petalIndex = remainingPetals[arrayPos];
      remainingPetals.splice(arrayPos, 1);

      const petalEl = petalsGroup.querySelector(`[data-index="${petalIndex}"]`);
      if (petalEl) {
        const currentAngle = parseFloat(petalEl.dataset.angle || '0');
        const direction = Math.random() > 0.5 ? 1 : -1;
        petalEl.style.setProperty('--dir', direction);
        petalEl.style.setProperty('--base-rot', currentAngle + 'deg');
        petalEl.classList.add('plucked-falling');

        setTimeout(() => {
          if (petalEl.parentNode) petalEl.remove();
        }, 1000);
      }

      flowerHead.classList.remove('spring-recoil');
      stemSvg.classList.remove('neck-recoil');
      void flowerHead.offsetWidth;
      flowerHead.classList.add('spring-recoil');
      stemSvg.classList.add('neck-recoil');

      stateIndex++;
      const isLovesMe = (stateIndex % 2 === 1);
      const isLastPetal = (remainingPetals.length === 0);

      if (!isLastPetal) {
        if (isLovesMe) {
          playCuteChime('love');
          setFaceExpression('happy');
          updateUI('LOVES ME! 💕', 'text-pink-300 drop-shadow-[0_4px_22px_rgba(244,114,182,0.9)]', 'Yay! A heartbeat skipped for you! ✨', remainingPetals.length);
          spawnParticles('hearts');
        } else {
          playCuteChime('not');
          setFaceExpression('shy-sad');
          updateUI('LOVES ME NOT... 🍃', 'text-indigo-200 drop-shadow-[0_4px_16px_rgba(165,180,252,0.7)]', 'A quiet flutter in the night breeze... 💧', remainingPetals.length);
          spawnParticles('leaves');
        }
      } else {
        setTimeout(() => {
          if (isLovesMe) {
            playCuteChime('fanfare');
            setFaceExpression('celebrate');
            updateUI('THEY LOVE YOU! ❤️✨', 'text-pink-400 drop-shadow-[0_6px_32px_rgba(244,63,94,1)] banner-pop', '💖 Destined forever & always under the stars! 💖', 0);
            spawnParticles('celebration');
            setTimeout(() => spawnParticles('celebration'), 350);
            setTimeout(() => spawnParticles('hearts'), 700);
          } else {
            playCuteChime('consoling');
            setFaceExpression('pout');
            updateUI('LOVES ME NOT... 💔', 'text-purple-300 drop-shadow-[0_6px_24px_rgba(192,132,252,0.85)] banner-pop', '🌧️ Maybe next time... or regrow another flower! 🌱🌼', 0);
            spawnParticles('leaves');
            setTimeout(() => spawnParticles('leaves'), 350);
          }
        }, 220);
      }

      setTimeout(() => {
        isAnimating = false;
      }, 420);
    }

    function updateUI(titleText, titleClass, subtitleText, count) {
      statusTitle.className = `text-[1.65rem] sm:text-5xl md:text-6xl font-black tracking-wide transition-all duration-300 transform scale-105 px-2 ${titleClass}`;
      statusTitle.textContent = titleText;
      setTimeout(() => {
        statusTitle.classList.remove('scale-105');
      }, 200);

      subStatus.textContent = subtitleText;
      petalsCount.textContent = `${count}/${currentTotalPetals}`;

      if (count === 0) {
        pluckBtn.disabled = true;
        pluckBtn.classList.add('opacity-40', 'cursor-not-allowed', 'scale-95');
      } else {
        pluckBtn.disabled = false;
        pluckBtn.classList.remove('opacity-40', 'cursor-not-allowed', 'scale-95');
      }
    }

    pluckBtn.addEventListener('click', () => {
      pluckBtn.classList.add('haptic-pop');
      setTimeout(() => pluckBtn.classList.remove('haptic-pop'), 250);
      pluckNextPetal();
    });

    flowerCenterKawaii.addEventListener('click', () => {
      pluckNextPetal();
    });

    resetBtn.addEventListener('click', () => {
      resetBtn.classList.add('haptic-pop');
      setTimeout(() => resetBtn.classList.remove('haptic-pop'), 250);
      initializeFlower(true);
    });

    window.addEventListener('resize', () => {
      createStars();
    });

    createStars();
    createFireflies();
    initializeFlower(false);
  </script>
</body></html>
