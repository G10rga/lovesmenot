<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&amp;family=Nunito:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', 'Nunito', sans-serif;
      user-select: none;
      overflow: hidden;
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 60%, #090d16 100%);
    }

    /* Ambient drifting clouds */
    @keyframes cloudDriftSlow {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(280%); }
    }
    @keyframes cloudDriftFast {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(240%); }
    }
    .cloud-slow {
      animation: cloudDriftSlow 52s linear infinite;
    }
    .cloud-fast {
      animation: cloudDriftFast 38s linear infinite;
    }

    /* Star sparkles */
    @keyframes sparkleGlow {
      0%, 100% { opacity: 0.35; transform: scale(0.7) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.25) rotate(45deg); filter: drop-shadow(0 0 6px rgba(255,248,198,0.9)); }
    }
    .twinkle-star {
      animation: sparkleGlow var(--speed, 3s) infinite ease-in-out;
    }

    /* Grass gentle swaying */
    @keyframes swaySoft {
      0%, 100% { transform: rotate(-1.5deg); }
      50% { transform: rotate(2deg); }
    }
    .sway-grass {
      transform-origin: bottom center;
      animation: swaySoft 4.5s ease-in-out infinite;
    }

    /* Flower spring bounce when plucked */
    @keyframes flowerPluckRecoil {
      0% {
        transform: translate(-50%, 0) rotate(0deg);
      }
      22% {
        transform: translate(calc(-50% + 15px), 7px) rotate(8.5deg);
      }
      48% {
        transform: translate(calc(-50% - 10px), -5px) rotate(-5deg);
      }
      70% {
        transform: translate(calc(-50% + 5px), 2px) rotate(2.5deg);
      }
      85% {
        transform: translate(calc(-50% - 2px), -1px) rotate(-1deg);
      }
      100% {
        transform: translate(-50%, 0) rotate(0deg);
      }
    }
    .spring-recoil {
      animation: flowerPluckRecoil 0.72s cubic-bezier(0.28, 1.45, 0.58, 1) !important;
      transform-origin: center 80px;
    }

    /* Upper neck gentle recoil reaction */
    @keyframes neckSpring {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(5deg) translateX(4px); }
      55% { transform: rotate(-3deg) translateX(-2px); }
      80% { transform: rotate(1.2deg); }
      100% { transform: rotate(0deg); }
    }
    .neck-recoil {
      animation: neckSpring 0.72s cubic-bezier(0.28, 1.45, 0.58, 1);
      transform-origin: 104px 220px;
    }

    /* Tall stem gentle organic sway */
    @keyframes stemSwayTilted {
      0%, 100% { transform: rotate(-2.5deg); }
      50% { transform: rotate(1.5deg); }
    }
    .stem-gentle-sway {
      transform-origin: bottom center;
      animation: stemSwayTilted 6s ease-in-out infinite;
    }

    /* Floating particles / hearts / petals */
    @keyframes floatParticle {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.4) rotate(0deg);
      }
      15% {
        opacity: 1;
        transform: translate(calc(-50% + var(--dx, 0px) * 0.3), calc(-50% - 25px)) scale(1.15) rotate(15deg);
      }
      80% {
        opacity: 0.9;
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% - 140px)) scale(0.7) rotate(var(--rot, 45deg));
      }
    }
    .particle-float {
      animation: floatParticle 2.4s cubic-bezier(0.2, 0.8, 0.25, 1) forwards;
    }

    /* Falling plucked petal */
    @keyframes petalFallFlutter {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1) rotate(var(--base-rot, 0deg));
      }
      25% {
        opacity: 0.95;
        transform: translate(calc(var(--dir, 1) * 35px), 40px) scale(0.96) rotate(calc(var(--base-rot, 0deg) + var(--dir, 1) * 35deg));
      }
      55% {
        opacity: 0.8;
        transform: translate(calc(var(--dir, 1) * 15px), 115px) scale(0.9) rotate(calc(var(--base-rot, 0deg) + var(--dir, 1) * -25deg));
      }
      100% {
        opacity: 0;
        transform: translate(calc(var(--dir, 1) * 55px), 230px) scale(0.7) rotate(calc(var(--base-rot, 0deg) + var(--dir, 1) * 95deg));
      }
    }
    .plucked-falling {
      animation: petalFallFlutter 0.95s cubic-bezier(0.35, 0.1, 0.25, 1) forwards !important;
      pointer-events: none;
    }

    /* Blossom grow animation */
    @keyframes sproutBloom {
      0% {
        transform: scale(0) translateY(180px) rotate(-20deg);
        opacity: 0;
      }
      65% {
        transform: scale(1.12) translateY(-10px) rotate(4deg);
        opacity: 1;
      }
      85% {
        transform: scale(0.96) translateY(2px) rotate(-2deg);
      }
      100% {
        transform: scale(1) translateY(0) rotate(0deg);
        opacity: 1;
      }
    }
    .blooming-sprout {
      animation: sproutBloom 1s cubic-bezier(0.34, 1.45, 0.64, 1) forwards;
    }

    /* Subtle eye blinking */
    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.08); }
    }
    .eye-blink {
      transform-origin: center;
      animation: blink 4s infinite;
    }

    /* Glow ring for storybook card */
    .storybook-glow {
      box-shadow: 0 25px 60px -15px rgba(22, 13, 58, 0.7),
                  0 0 50px -10px rgba(236, 140, 180, 0.25),
                  inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }
  </style>
</head>

      },
      {
        path: 'M -12 -23 C -24 -46, -21 -81, -12 -105 C -5 -116, 8 -116, 13 -105 C 22 -85, 20 -50, 11 -22 C 5 -14, -5 -14, -12 -23 Z',
        vein: 'M -0.5 -24 Q -3 -62 0 -98',
        gloss: { cx: -1, cy: -83, rx: 5.4, ry: 13, rot: -1 },
        rim: 'M -7 -104 Q 1 -110 8 -104',
        extraRot: -1.8
      },
      {
        path: 'M -11 -22 C -21 -52, -18 -84, -10 -105 C -3 -116, 10 -115, 14 -104 C 20 -86, 22 -52, 12 -22 C 6 -13, -5 -13, -11 -22 Z',
        vein: 'M 0 -24 Q 2 -64 2 -98',
        gloss: { cx: 2, cy: -84, rx: 5.1, ry: 13.5, rot: 2 },
        rim: 'M -5 -104 Q 3 -110 9 -104',
        extraRot: 1.2
      }
    ];

    function pickRandomPetalCount() {
      const wantsLovesMe = Math.random() < 0.5;
      const candidates = [];
      for (let n = 6; n <= 11; n++) {
        if (wantsLovesMe ? n % 2 === 1 : n % 2 === 0) candidates.push(n);
      }
      return candidates[Math.floor(Math.random() * candidates.length)];
    }

    function createStars() {
      starsLayer.innerHTML = '';
      const starCount = 18;
      for (let i = 0; i < starCount; i++) {
        const star = document.createElement('div');
        star.className = 'twinkle-star absolute pointer-events-none';

        const size = Math.floor(Math.random() * 12) + 8;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.left = (Math.random() * 90 + 5) + '%';
        star.style.top = (Math.random() * 55 + 5) + '%';
        star.style.setProperty('--speed', (2 + Math.random() * 3) + 's');
        star.style.animationDelay = (Math.random() * 3) + 's';

        star.innerHTML = `
          <svg viewBox="0 0 24 24" class="w-full h-full fill-amber-100/90">
            <path d="M12 0 Q12 12 0 12 Q12 12 12 24 Q12 12 24 12 Q12 12 12 0 Z"/>
          </svg>
        `;
        starsLayer.appendChild(star);
      }
    }

    function createPetalElement(index, total) {
      const baseAngle = (360 / total) * index;
      const profile = PETAL_PROFILES[index % PETAL_PROFILES.length];
      const finalAngle = baseAngle + profile.extraRot;

      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('transform', `rotate(${finalAngle})`);
      g.setAttribute('filter', 'url(#softPetalShadow)');
      g.dataset.index = index;
      g.dataset.angle = finalAngle;
      g.style.cursor = 'pointer';
      g.style.transformOrigin = '0px 0px';
      g.style.transition = 'transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease';

      const petalPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      petalPath.setAttribute('d', profile.path);
      petalPath.setAttribute('fill', index % 2 === 0 ? 'url(#petalGradient)' : 'url(#petalWarmGrad)');
      petalPath.setAttribute('stroke', '#fdf4ff');
      petalPath.setAttribute('stroke-width', '2.2');
      petalPath.setAttribute('stroke-linejoin', 'round');

      const vein = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      vein.setAttribute('d', profile.vein);
      vein.setAttribute('stroke', '#e9d5ff');
      vein.setAttribute('stroke-width', '1.8');
      vein.setAttribute('stroke-linecap', 'round');
      vein.setAttribute('fill', 'none');

      const gloss = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
      gloss.setAttribute('cx', profile.gloss.cx);
      gloss.setAttribute('cy', profile.gloss.cy);
      gloss.setAttribute('rx', profile.gloss.rx);
      gloss.setAttribute('ry', profile.gloss.ry);
      if (profile.gloss.rot) {
        gloss.setAttribute('transform', `rotate(${profile.gloss.rot} ${profile.gloss.cx} ${profile.gloss.cy})`);
      }
      gloss.setAttribute('fill', '#ffffff');
      gloss.setAttribute('opacity', '0.7');

      const rimSheen = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      rimSheen.setAttribute('d', profile.rim);
      rimSheen.setAttribute('stroke', '#ffffff');
      rimSheen.setAttribute('stroke-width', '2.4');
      rimSheen.setAttribute('stroke-linecap', 'round');
      rimSheen.setAttribute('fill', 'none');
      rimSheen.setAttribute('opacity', '0.85');

      g.appendChild(petalPath);
      g.appendChild(vein);
      g.appendChild(gloss);
      g.appendChild(rimSheen);

      g.addEventListener('mouseenter', () => {
        if (!isAnimating) {
          g.setAttribute('transform', `rotate(${finalAngle}) scale(1.08)`);
        }
      });
      g.addEventListener('mouseleave', () => {
        if (!isAnimating) {
          g.setAttribute('transform', `rotate(${finalAngle}) scale(1)`);
        }
      });

      g.addEventListener('click', (e) => {
        e.stopPropagation();
        pluckSpecificPetal(index);
      });

      return g;
    }

    function setFaceExpression(mood) {
      if (mood === 'happy') {
        mouth.setAttribute('d', 'M -8 8 Q 0 20 8 8 Z');
        tongue.style.display = 'block';
        blushLeft.style.opacity = '0.85';
        blushRight.style.opacity = '0.85';
        blushLeft.setAttribute('fill', '#f43f5e');
        blushRight.setAttribute('fill', '#f43f5e');
        sweatDrop.style.opacity = '0';
      } else if (mood === 'shy-sad') {
        mouth.setAttribute('d', 'M -7 13 Q 0 7 7 13');
        tongue.style.display = 'none';
        blushLeft.style.opacity = '0.45';
        blushRight.style.opacity = '0.45';
        blushLeft.setAttribute('fill', '#ec4899');
        blushRight.setAttribute('fill', '#ec4899');
        sweatDrop.style.opacity = '0.9';
      } else {
        mouth.setAttribute('d', 'M -7 9 Q 0 17 7 9');
        tongue.style.display = 'block';
        blushLeft.style.opacity = '0.6';
        blushRight.style.opacity = '0.6';
        sweatDrop.style.opacity = '0';
      }
    }

    function spawnParticles(type = 'hearts') {
      const count = type === 'hearts' ? 16 : 10;
      const headRect = flowerHead.getBoundingClientRect();
      const parentRect = particlesContainer.getBoundingClientRect();

      const originX = headRect.left - parentRect.left + headRect.width / 2;
      const originY = headRect.top - parentRect.top + headRect.height / 2;

      for (let i = 0; i < count; i++) {
        const particle = document.createElement('div');
        particle.className = 'absolute particle-float pointer-events-none select-none';

        const dx = (Math.random() - 0.5) * 160;
        const rot = (Math.random() - 0.5) * 120;
        const delay = Math.random() * 0.35;
        const scale = 0.8 + Math.random() * 0.7;

        particle.style.left = (originX + (Math.random() - 0.5) * 50) + 'px';
        particle.style.top = (originY + (Math.random() - 0.5) * 40) + 'px';
        particle.style.setProperty('--dx', dx + 'px');
        particle.style.setProperty('--rot', rot + 'deg');
        particle.style.animationDelay = delay + 's';
        particle.style.transform = `scale(${scale})`;

        if (type === 'hearts') {
          const heartIcons = ['💖', '💕', '✨', '🌸', '💫'];
          const icon = heartIcons[Math.floor(Math.random() * heartIcons.length)];
          particle.innerHTML = `<span class="text-xl filter drop-shadow-[0_4px_8px_rgba(244,63,94,0.6)]">${icon}</span>`;
        } else {
          const sadIcons = ['🍃', '🍂', '💧', '✨'];
          const icon = sadIcons[Math.floor(Math.random() * sadIcons.length)];
          particle.innerHTML = `<span class="text-xl filter drop-shadow-[0_3px_6px_rgba(100,116,139,0.5)]">${icon}</span>`;
        }

        particlesContainer.appendChild(particle);

        setTimeout(() => {
          particle.remove();
        }, 2600);
      }
    }

    function initializeFlower(withBloomAnimation = false) {
      TOTAL_PETALS = pickRandomPetalCount();
      petalsGroup.innerHTML = '';
      remainingPetals = [];
      stateIndex = 0;
      isAnimating = false;

      for (let i = 0; i < TOTAL_PETALS; i++) {
        const petalEl = createPetalElement(i, TOTAL_PETALS);
        petalsGroup.appendChild(petalEl);
        remainingPetals.push(i);
      }

      setFaceExpression('neutral');
      updateUI('LOVES ME NOT', 'text-white', '✨ Pluck a soft petal to discover their heart ✨', TOTAL_PETALS);

      if (withBloomAnimation) {
        flowerHead.classList.remove('spring-recoil');
        stemSvg.classList.remove('neck-recoil');
        flowerWrapper.classList.remove('blooming-sprout');
        void flowerWrapper.offsetWidth;
        flowerWrapper.classList.add('blooming-sprout');

        setTimeout(() => {
          spawnParticles('hearts');
        }, 450);
      }
    }

    function pluckSpecificPetal(targetIndex) {
      if (isAnimating) return;
      const pos = remainingPetals.indexOf(targetIndex);
      if (pos === -1) return;
      pluckAtIndex(pos);
    }

    function pluckNextPetal() {
      if (isAnimating || remainingPetals.length === 0) return;
      pluckAtIndex(0);
    }

    function pluckAtIndex(arrayPos) {
      isAnimating = true;
      const petalIndex = remainingPetals[arrayPos];
      remainingPetals.splice(arrayPos, 1);

      const petalEl = petalsGroup.querySelector(`[data-index="${petalIndex}"]`);
      if (petalEl) {
        const currentAngle = parseFloat(petalEl.dataset.angle || '0');
        const direction = Math.random() > 0.5 ? 1 : -1;
        petalEl.style.setProperty('--dir', direction);
        petalEl.style.setProperty('--base-rot', currentAngle + 'deg');
        petalEl.classList.add('plucked-falling');

        setTimeout(() => {
          if (petalEl.parentNode) petalEl.remove();
        }, 900);
      }

      flowerHead.classList.remove('spring-recoil');
      stemSvg.classList.remove('neck-recoil');
      void flowerHead.offsetWidth;
      flowerHead.classList.add('spring-recoil');
      stemSvg.classList.add('neck-recoil');

      stateIndex++;
      const isLovesMe = (stateIndex % 2 === 1);

      if (isLovesMe) {
        setFaceExpression('happy');
        updateUI('LOVES ME! 💕', 'text-pink-300 drop-shadow-[0_4px_16px_rgba(244,114,182,0.85)]', 'Yay! A heartbeat skipped for you! ✨', remainingPetals.length);
        spawnParticles('hearts');
      } else {
        setFaceExpression('shy-sad');
        updateUI('LOVES ME NOT... 🍃', 'text-indigo-200 drop-shadow-[0_4px_14px_rgba(165,180,252,0.7)]', 'A quiet flutter in the autumn breeze... 💧', remainingPetals.length);
        spawnParticles('leaves');
      }

      if (remainingPetals.length === 0) {
        setTimeout(() => {
          if (isLovesMe) {
            setFaceExpression('happy');
            updateUI('TRUE LOVE! 💖🌸', 'text-pink-300 drop-shadow-[0_4px_20px_rgba(244,63,94,0.9)]', 'Destined forever & always! ✨✨✨', 0);
            spawnParticles('hearts');
            setTimeout(() => spawnParticles('hearts'), 300);
          } else {
            setFaceExpression('shy-sad');
            updateUI('TRY AGAIN! 🌱', 'text-amber-200 drop-shadow-[0_4px_16px_rgba(251,191,36,0.7)]', 'The next daisy might whisper yes! ✨', 0);
          }
        }, 400);
      }

      setTimeout(() => {
        isAnimating = false;
      }, 420);
    }

    function updateUI(titleText, titleClass, subtitleText, count) {
      statusTitle.className = `text-3xl sm:text-4xl font-extrabold tracking-wide transition-all duration-300 transform scale-105 ${titleClass}`;
      statusTitle.textContent = titleText;
      setTimeout(() => {
        statusTitle.classList.remove('scale-105');
      }, 200);

      subStatus.textContent = subtitleText;
      petalsCount.textContent = `${count}/${TOTAL_PETALS}`;

      if (count === 0) {
        pluckBtn.disabled = true;
        pluckBtn.classList.add('opacity-40', 'cursor-not-allowed', 'scale-95');
      } else {
        pluckBtn.disabled = false;
        pluckBtn.classList.remove('opacity-40', 'cursor-not-allowed', 'scale-95');
      }
    }

    pluckBtn.addEventListener('click', pluckNextPetal);
    flowerCenterKawaii.addEventListener('click', pluckNextPetal);
    resetBtn.addEventListener('click', () => {
      initializeFlower(true);
    });

    createStars();
    initializeFlower(false);
  </script>
</body></html>
